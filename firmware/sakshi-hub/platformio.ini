[env:esp32-c3-hardware]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
  -DSAKSHI_FIRMWARE_VERSION=\"2.1.4\"
lib_deps =
  sensirion/Sensirion I2C SHT4x @ ^1.1.0
  sparkfun/SparkFun ATECCX08a Arduino Library @ ^1.3.2
  bblanchon/ArduinoJson @ ^7.3.0
  knolleary/PubSubClient @ ^2.8

[env:esp32-c3-sim-board]
extends = env:esp32-c3-hardware
build_flags =
  ${env:esp32-c3-hardware.build_flags}
  -DSAKSHI_SIM_SENSORS=1
